name: Validation continue

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ramaqs-management-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ramaqs-management-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ramaqs_test
          POSTGRES_USER: ramaqs
          POSTGRES_PASSWORD: ramaqs_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ramaqs -d ramaqs_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: Backend Django/ramaqs_management_app
    env:
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production
      DJANGO_DEBUG: 'True'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      DB_NAME: ramaqs_test
      DB_USER: ramaqs
      DB_PASSWORD: ramaqs_test_password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend Django/ramaqs_management_app/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py check
      - run: python manage.py test ramaqs_management_plateforme.tests.PreproductionApiTests --verbosity 1
